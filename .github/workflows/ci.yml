name: Windows 检查
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: 测试
        run: cargo +stable test --locked --all-targets --features record --target x86_64-pc-windows-msvc -- --test-threads=1
      - name: 构建并检查发布运行库
        shell: pwsh
        run: |
          # 与 scripts/package.ps1 的发布构建保持一致：把构建机用户目录和源码绝对路径重映射掉。
          # 否则下一步「验证发布打包」会在 exe 里检出 C:\Users\runneradmin 并判定为泄露构建机路径。
          $projectRoot = (Get-Location).Path
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $env:CARGO_ENCODED_RUSTFLAGS = @('-C', 'target-feature=+crt-static', "--remap-path-prefix=$cargoHome=cargo", "--remap-path-prefix=$projectRoot=daozai", '-C', 'link-arg=/PDBALTPATH:%_PDB%') -join [char]0x1f
          cargo +stable build --locked --release --bin daozai --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw '发布构建失败' }
          ./scripts/check-runtime.ps1 -Executable ./target/x86_64-pc-windows-msvc/release/daozai.exe
      - name: 检查安装脚本语法
        shell: pwsh
        run: |
          Get-ChildItem installer,scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$null,[ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: 验证发布打包
        shell: pwsh
        run: |
          $compiler = ./scripts/get-nsis.ps1 -Directory $env:RUNNER_TEMP
          ./scripts/package.ps1 -SkipBuild -NsisCompiler $compiler
      - name: 上传发布产物
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: daozai-release-${{ github.ref_name }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.txt
          if-no-files-found: error
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 验证安装、升级与卸载
        shell: pwsh
        run: |
          $compiler = ./scripts/get-nsis.ps1 -Directory $env:RUNNER_TEMP
          ./tests/native_installer.ps1 -NsisCompiler $compiler
          ./tests/update_installer.ps1
          exit 0
